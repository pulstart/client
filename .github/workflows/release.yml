name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Windows FFmpeg SDK. macOS uses ffmpeg@7, available on hosted runners.
  # The pinned ffmpeg-next 8 bindings support both native library versions.
  FFMPEG_VERSION: "8.1"
  FFMPEG_BUILD_TAG: "latest"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            build_kind: unix
            package_id: linux-x64
          - name: macOS x64
            os: macos-15-intel
            build_kind: unix
            package_id: macos-x64
          - name: macOS arm64
            os: macos-15
            build_kind: unix
            package_id: macos-arm64
          - name: Windows x64
            os: windows-2022
            build_kind: windows
            package_id: windows-x64

    steps:
      - name: Checkout client with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.PROTOCOL_CHECKOUT_TOKEN || github.token }}

      - name: Derive version from git tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          prefix-key: v3

      - name: Stamp Cargo.toml version
        shell: bash
        run: |
          sed -i.bak 's/^version = ".*"/version = "${{ steps.version.outputs.version }}"/' Cargo.toml
          rm -f Cargo.toml.bak
          echo "Cargo.toml version is now:"
          grep '^version' Cargo.toml
          cargo generate-lockfile

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libavutil-dev \
            libavcodec-dev \
            libavformat-dev \
            libswscale-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libopus-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            pkg-config

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@7 opus pkg-config
          FFMPEG_PREFIX="$(brew --prefix ffmpeg@7)"
          OPUS_PREFIX="$(brew --prefix opus)"
          echo "PKG_CONFIG_PATH=${FFMPEG_PREFIX}/lib/pkgconfig:${OPUS_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "FFMPEG_DIR=${FFMPEG_PREFIX}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${FFMPEG_PREFIX}/lib:${OPUS_PREFIX}/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"
          # Cached bindings must match the selected FFmpeg major version.
          cargo clean -p ffmpeg-sys-next

      # --- Windows: pre-built FFmpeg + vcpkg for opus only ---

      - name: Cache pre-built FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ffmpeg-prebuilt
          key: ${{ runner.os }}-ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_BUILD_TAG }}

      - name: Download pre-built FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegZip = "ffmpeg-n${{ env.FFMPEG_VERSION }}-${{ env.FFMPEG_BUILD_TAG }}-win64-lgpl-shared-${{ env.FFMPEG_VERSION }}.zip"
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ env.FFMPEG_BUILD_TAG }}/$ffmpegZip"
          $downloadDir = "${{ github.workspace }}\ffmpeg-prebuilt"
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $zipPath = "$downloadDir\$ffmpegZip"
          if (-not (Test-Path $zipPath)) {
            Write-Host "Downloading $ffmpegUrl ..."
            Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath -UseBasicParsing
          }
          Expand-Archive -Path $zipPath -DestinationPath $downloadDir -Force
          $extractedDir = Get-ChildItem -Path $downloadDir -Directory | Where-Object { $_.Name -like "ffmpeg-*" } | Select-Object -First 1
          echo "FFMPEG_DIR=$($extractedDir.FullName)" >> $env:GITHUB_ENV
          Write-Host "FFmpeg extracted to $($extractedDir.FullName)"

      - name: Checkout vcpkg
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Restore vcpkg cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            ~\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-opus-v1
          restore-keys: |
            ${{ runner.os }}-vcpkg-opus-

      - name: Verify macOS update and bundle behavior
        if: runner.os == 'macOS'
        run: |
          python3 scripts/test_macos_bundle.py
          cargo test --release --locked updater::tests

      - name: Build Unix release
        if: matrix.build_kind == 'unix'
        run: cargo build --release --locked

      - name: Package Unix artifact
        if: matrix.build_kind == 'unix'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: bash ./scripts/package-unix.sh --platform ${{ matrix.package_id }}

      - name: Build Windows release
        if: matrix.build_kind == 'windows'
        shell: pwsh
        run: .\scripts\build-windows-msvc.ps1 -Configuration release -VcpkgRoot "${{ github.workspace }}\vcpkg" -FfmpegDir "${{ env.FFMPEG_DIR }}" -BootstrapVcpkg

      - name: Package Windows artifact
        if: matrix.build_kind == 'windows'
        shell: pwsh
        run: .\scripts\package-windows-release.ps1 -Configuration release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_id }}
          path: dist/*-${{ matrix.package_id }}.*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      # Must match `ndkVersion` in android/app/build.gradle.kts and the fallback
      # path in android/build.gradle.kts.
      ANDROID_NDK_VERSION: "29.0.14206865"
      # Lifted to the job so the decode step can test it in `if:` — the secrets
      # context is not available in a step-level condition.
      ST_ANDROID_KEYSTORE_BASE64: ${{ secrets.ST_ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout client with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.PROTOCOL_CHECKOUT_TOKEN || github.token }}

      - name: Derive version from git tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # versionCode must be a monotonically increasing integer, so pack the
          # semver components into one: major*1e6 + minor*1e3 + patch. Untagged
          # dev builds get 1, the minimum Android accepts.
          core="${version%%-*}"
          IFS='.' read -r major minor patch <<< "$core"
          if [[ "$version" == "0.0.0-dev" ]]; then
            code=1
          else
            code=$(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
            [[ "$code" -lt 1 ]] && code=1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (versionCode $code)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            android/rust -> target
          prefix-key: v1-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Stamp Android version
        shell: bash
        working-directory: android
        run: |
          sed -i \
            -e 's/^\( *versionCode *= *\).*/\1${{ steps.version.outputs.code }}/' \
            -e 's/^\( *versionName *= *\).*/\1"${{ steps.version.outputs.version }}"/' \
            app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Decode release keystore
        id: keystore
        if: env.ST_ANDROID_KEYSTORE_BASE64 != ''
        run: |
          keystore="$RUNNER_TEMP/st-release.jks"
          echo "$ST_ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "ST_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          # When these are unset, app/build.gradle.kts falls back to Android's
          # local debug key so the APK is still installable outside Play.
          ST_ANDROID_STORE_PASSWORD: ${{ secrets.ST_ANDROID_STORE_PASSWORD }}
          ST_ANDROID_KEY_ALIAS: ${{ secrets.ST_ANDROID_KEY_ALIAS }}
          ST_ANDROID_KEY_PASSWORD: ${{ secrets.ST_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Package Android artifact
        shell: bash
        run: |
          mkdir -p dist
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "APK not found at $apk"; exit 1; }
          cp "$apk" "dist/st-client-v${{ steps.version.outputs.version }}-android.apk"
          ls -l dist

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*-android.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, android]
    runs-on: ubuntu-24.04

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Recreate existing release for this tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Deleting existing release ${release.id} for tag ${tag}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`No existing release found for tag ${tag}`);
                return;
              }
              throw error;
            }

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
